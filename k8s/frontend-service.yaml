# ==============================================================================
# Service: Frontend Internal ClusterIP Service
# ==============================================================================
# Exposes frontend web server internally on port 80 within the event-portal namespace.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: event-portal
  labels:
    app: frontend
    tier: web
spec:
  type: ClusterIP # Internal cluster communication only
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: frontend # Directs traffic to pods labeled 'app: frontend'
