# ==============================================================================
# Secret: Backend Sensitive Credentials
# ==============================================================================
# Stores sensitive configuration values like JWT signing secrets securely.
# stringData allows readable plain text definition; Kubernetes encrypts/encodes it automatically.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: event-portal
type: Opaque
stringData:
  JWT_SECRET: "nimbus-dev-secret-change-in-production"
