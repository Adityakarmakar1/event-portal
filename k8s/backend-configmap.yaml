# ==============================================================================
# ConfigMap: Backend Non-Sensitive Environment Variables
# ==============================================================================
# Stores non-confidential configuration values for the Express backend.
# MONGODB_URI connects directly to the Kubernetes service 'mongodb' on port 27017.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: event-portal
data:
  PORT: "5000"
  MONGODB_URI: "mongodb://mongodb:27017/nimbus"
  CLIENT_URL: "http://localhost:3000"
